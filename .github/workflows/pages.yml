name: Pages

# Publishes ONLY the curated landing page in site/ — not the repository tree.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check site contents
        run: |
          test -f site/index.html
          # The published site must stay a small curated set of static files.
          unexpected=$(find site -type f ! -name '*.html' ! -name '*.css' ! -name '*.svg' ! -name '*.png' ! -name '*.ico' ! -name '*.txt')
          if [ -n "$unexpected" ]; then
            echo "Unexpected files in site/:"; echo "$unexpected"; exit 1
          fi
          find site -type f

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
